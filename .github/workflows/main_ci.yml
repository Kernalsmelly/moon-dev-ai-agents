name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-ci.txt

      - name: Runtime compile check (quarantine src/data)
        run: python scripts/repo_runtime_compile_check.py

      - name: Run pytest
        run: python -m pytest -q

      - name: Smoke test analyzer with dummy CSV
        run: |
          mkdir -p data
          cat > data/alpha_journal.csv <<'CSV'
          ts,mint,name,volume_pct,expected_out_raw,expected_out_sol,input_amount_sol,unitsConsumed,balance_lamports,success
          2026-01-14T00:00:00Z,So11111111111111111111111111111111111111112,SAMPLE,400,1000000000,1.0,0.1,200000,100000000,True
          CSV
          python src/analyzer.py
